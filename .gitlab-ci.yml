# ── herdr-sdk CI/CD ──────────────────────────────────────────────────────────
# lint → test → security → build → publish
#
# Follows the homelab fleet standard (homelab/ci-templates README): templates pinned to a vX.Y.Z tag,
# ci/lib vendored and checked against that tag (lint:vendored-lib), the canonical workflow: block copied
# verbatim, images from the Harbor proxy and pinned, job names scoped by stage, shell in ci/*.sh.
# Deliberate divergence, recorded in HERDR-ADR-0019: the package is published on a protected v* tag
# (version = herdr protocol policy, set by hand), not by python-semantic-release from commit messages,
# and the registry login is the job token, so no release token variable is needed.

include:
  - project: 'homelab/ci-templates'
    ref: 'v0.11.0'
    file: '/templates/security.yml'

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      auto_cancel:
        on_job_failure: all
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - if: $DEPLOY_BRANCHES && $CI_COMMIT_BRANCH =~ $DEPLOY_BRANCHES
    - when: never

stages: [lint, test, security, build, publish]

variables:
  GIT_SUBMODULE_STRATEGY: "none"
  CI_TEMPLATES_REF: 'v0.11.0'
  CI_TEMPLATES_URL: 'https://gitlab.example.internal/homelab/ci-templates.git'

default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

.bun:
  image: docker.io/oven/bun:1.4.4
  tags:
    - kubernetes

lint:vendored-lib:
  stage: lint
  image: docker.io/library/node:22.23.3-bookworm
  tags:
    - kubernetes
  needs: []
  variables:
    VENDORED_PATHS: "ci/lib"
  before_script:
    - bash ci/git-use-job-token.sh
  script:
    - bash ci/lib/check-vendored.sh

lint:shell:
  stage: lint
  image: docker.io/koalaman/shellcheck-alpine:v0.11.0
  tags:
    - kubernetes
  needs: []
  script:
    - shellcheck --version
    - shellcheck ci/*.sh ci/lib/*.sh

lint:typecheck:
  extends: .bun
  stage: lint
  needs: []
  script:
    - bash ci/typecheck.sh

test:unit:
  extends: .bun
  stage: test
  needs:
    - job: lint:typecheck
  script:
    - bash ci/test.sh

# The image, manifest and config scanners do not apply: this repo builds no image and ships no manifests.
# security:deps scans the lockfile offline, security:secrets scans the full history.
security:image:
  stage: security
  needs: []
  rules:
    - when: never

security:manifests:
  stage: security
  needs: []
  rules:
    - when: never

security:config:
  stage: security
  needs: []
  rules:
    - when: never

build:package:
  extends: .bun
  stage: build
  needs:
    - job: test:unit
  timeout: 20m
  script:
    - bash ci/build.sh
  artifacts:
    paths:
      - dist/
    expire_in: 30 days

# A protected v* tag (Maintainers only) publishes @homelab/herdr to this project's npm registry with the job token.
publish:package:
  image: docker.io/library/node:22.23.3-bookworm
  tags:
    - kubernetes
  stage: publish
  needs:
    - job: lint:vendored-lib
    - job: lint:shell
    - job: test:unit
    - job: security:deps
    - job: security:secrets
    - job: build:package
      artifacts: true
  timeout: 20m
  interruptible: false
  resource_group: release
  script:
    - bash ci/publish-package.sh
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
