name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: npm 11.5.1 or later (trusted publishing)
        run: npx --yes semver@7.7.2 --range '>=11.5.1' "$(npm --version)"
      - name: The tag equals the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Skip a version npm already has
        id: seen
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$name@$version is already on npm: nothing to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.seen.outputs.published != 'true'
        run: bun install --frozen-lockfile
      - if: steps.seen.outputs.published != 'true'
        run: bun run typecheck
      - if: steps.seen.outputs.published != 'true'
        run: bun run lint:layers
      - if: steps.seen.outputs.published != 'true'
        run: bun run test
      - if: steps.seen.outputs.published != 'true'
        run: bun run test:node
      - if: steps.seen.outputs.published != 'true'
        run: bun run check:size
      - if: steps.seen.outputs.published != 'true'
        run: bash ci/build.sh
      - name: Publish with OIDC and provenance
        if: steps.seen.outputs.published != 'true'
        run: npm publish
