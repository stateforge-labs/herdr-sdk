name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: npm 11.5.1 or later (trusted publishing)
        run: npx --yes semver@7.7.2 --range '>=11.5.1' "$(npm --version)"
      - name: The tag equals the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint:layers
      - run: bun test
      - run: bun run test:node
      - run: bun run check:size
      - run: bash ci/build.sh
      - name: Publish with OIDC and provenance
        run: npm publish
